modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Planet World"
description='''
Transforms the Overworld into a finite, seamlessly wrapped torus planet with
localized time, localized weather, and curved horizon rendering.
World-wrapping core ported from Circumnavigate by Famro Fexl (AGPL-3.0).
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}-wrap.mixins.json"

[[mixins]]
config="${mod_id}-create.mixins.json"

[[mixins]]
config="${mod_id}-sable.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.10,6.1.0)"
    ordering="NONE"
    side="BOTH"

# Sable owns sub-level and rigid-body geometry; Planet World composes with it rather than replacing it.
# Load after Sable so the wrap hooks sit outside Sable's own sub-level math.
[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[2.0.0,3.0.0)"
    ordering="AFTER"
    side="BOTH"

# Create Aeronautics ships Simulated / Aeronautics / Offroad in one jar and adds no geometry of its
# own beyond Sable's, so it is declared only to pin the version this stack was tested against.
[[dependencies.${mod_id}]]
    modId="aeronautics_bundled"
    type="optional"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

# Terralith soft-dep: Realism climate remap + sparse Terralith surface seeds when present.
[[dependencies.${mod_id}]]
    modId="terralith"
    type="optional"
    versionRange="[2.5.0,)"
    ordering="AFTER"
    side="BOTH"

# End Remastered: custom eyes locate vanilla strongholds; PW guarantees a land+plains portal site on Realism.
[[dependencies.${mod_id}]]
    modId="endrem"
    type="optional"
    versionRange="[6.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sereneseasons"
    type="optional"
    versionRange="[9.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lithosphere"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="still_life"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="blooming_biosphere"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="optional"
    versionRange="[1.2.0,)"
    ordering="NONE"
    side="BOTH"

# Sodium: terrain shaders replaced — PW acknowledges via pack.mcmeta ignored_shaders (strategy A).
# Do not mark incompatible; wrap / local time / weather still work; horizon curve degrades.
[[dependencies.${mod_id}]]
    modId="sodium"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
